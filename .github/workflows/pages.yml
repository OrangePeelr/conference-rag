name: Deploy conference app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check source syntax
        run: |
          node --check app.js
          node --check config.js
          python3 -m compileall -q scripts
      - uses: actions/configure-pages@v5
      - name: Package public website assets
        run: |
          mkdir _site
          cp index.html app.js styles.css config.js config.public.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
